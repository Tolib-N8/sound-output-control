name: Soundflow
options:
  bundleIdPrefix: com.tolibnosirov
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Soundflow:
    type: application
    platform: macOS
    sources:
      - path: Soundflow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tolibnosirov.Soundflow
        PRODUCT_NAME: Soundflow
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "120"
        INFOPLIST_FILE: Soundflow/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Soundflow/Resources/Soundflow.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  SoundflowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SoundflowTests
    dependencies:
      - target: Soundflow
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Soundflow.app/Contents/MacOS/Soundflow"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  Soundflow:
    build:
      targets:
        Soundflow: all
        SoundflowTests: [test]
    test:
      targets:
        - SoundflowTests
